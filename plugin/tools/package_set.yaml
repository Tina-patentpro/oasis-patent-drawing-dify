    zh_Hans: 按当前规格和PNG实际SHA匹配全部图件，输出A4栅格PDF和含原件/矢量/清单的ZIP。文件校验不代表内容审阅。
  llm: 按当前规格和PNG实际SHA匹配全部图件，输出A4栅格PDF和含原件/矢量/清单的ZIP。文件校验不代表内容审阅。

[project]
name = "oasisintwrite-patent-drawing"
version = "0.3.8"
description = "Dify patent drawing generation and editing using OpenAI GPT-Image-2.6 Flare"
requires-python = ">=3.12"
dependencies = ["dify_plugin==0.4.5", "httpx==0.28.1", "Pillow==11.3.0", "defusedxml==0.7.1", "gevent==25.5.1", "pypdfium2==5.14.0"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Support for class-based.*:DeprecationWarning", "ignore:Monkey-patching ssl.*", "ignore:Patching more than once.*"]

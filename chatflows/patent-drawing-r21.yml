version: 0.7.0
kind: app
app:
  name: 专利附图集-GPT-0.3.9-R21-工程示意验证
  mode: advanced-chat
  description: 原图修改补充、无图新建、按技术类型规划、分层标注、中国附图规则核查；工程候选，非申请就绪。
  icon: 📐
  icon_type: emoji
  icon_background: '#E0F2FE'
  use_icon_as_answer_icon: false
dependencies:
- type: package
  value:
    plugin_unique_identifier: tina-patentpro/oasisintwrite_patent_drawing:0.3.9@79455235db272dc99ef3e9201178f0efa355b9e3bf8caef8adce05c813df7cf4
workflow:
  graph:
    nodes:
    - id: q_start
      type: custom
      position:
        x: 0
        y: 0
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 交底与用途
        desc: ''
        selected: false
        variables:
        - variable: materials
          label: 交底正文（已有PDF可留空）
          type: paragraph
          required: false
          max_length: 64000
          default: ''
        - variable: plan_json
          label: 审阅图单JSON（高级验证，可留空）
          type: paragraph
          required: false
          max_length: 400000
          default: ''
        - variable: patent_type
          label: 专利申请类型
          type: select
          required: true
          options:
          - 发明
          - 实用新型
          - 外观设计
          default: 发明
        - variable: technical_type
          label: 技术类型
          type: select
          required: true
          options:
          - 自动识别
          - 机械结构
          - 电气电路
          - 机电结构
          - 软件/计算机方法
          - 通信
          - 制造工艺
          - 化学材料
          - 生物医学
          - 半导体
          default: 自动识别
        - variable: application_stage
          label: 申请阶段
          type: select
          required: true
          options:
          - 申请前
          - 已申请
          default: 申请前
        - variable: image_budget
          label: 图集附加调用上限（0按操作员授权）
          type: number
          required: false
          default: 0
    - id: q_types
      type: custom
      position:
        x: 310
        y: 0
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 绑定申请和技术类型
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"Pure Dify code-node adapters; no credentials, HTTP or model dispatch.\"\
          \"\"\nimport json\n\n\ndef result(items):\n    if not isinstance(items,\
          \ list): raise ValueError('工具结果应为JSON数组')\n    rows = [x for x in items\
          \ if isinstance(x, dict) and 'workspace_id' in x]\n    if len(rows) != 1:\
          \ raise ValueError('缺少唯一工作区结果；未自动重试')\n    x = rows[0]\n    todos = {}\n\
          \    for field in ['failed_feature_ids', 'unknown_feature_ids', 'unreviewed_view_ids']:\n\
          \        value = x.get(field, [])\n        if not isinstance(value, list)\
          \ or any(not isinstance(v, str) for v in value):\n            raise ValueError('待办字段应为字符串数组：'\
          \ + field)\n        todos[field] = value\n    unknown = todos['unknown_feature_ids']\n\
          \    if any(value.count('/') != 1 or not all(value.split('/')) for value\
          \ in unknown):\n        raise ValueError('实际图待确认特征应使用视图/特征标识：unknown_feature_ids')\n\
          \    independent_source = bool(x.get('deferred_blocking_state')) and x.get('route')\
          \ == 'execute'\n    missing = x.get('missing_features', [])\n    if not\
          \ isinstance(missing, list) or any(not isinstance(v, str) or not v for v\
          \ in missing):\n        raise ValueError('引导待补充字段应为字符串数组：missing_features')\n\
          \    guide_blocked = bool(missing) and not independent_source\n    relation_review\
          \ = x.get('pending_action') == 'professional_relation_review' and not independent_source\n\
          \    actual_unknown = bool(unknown) and not independent_source\n    supplier\
          \ = x.get('supplier_state')\n    supplier_block = supplier in ('provider_rejected',\
          \ 'result_unknown')\n    blocked = (bool(x.get('blocking_state')) or supplier_block\
          \ or x.get('semantic_state') in {'FAIL','UNKNOWN'}\n               or guide_blocked\
          \ or relation_review\n               or bool(todos['failed_feature_ids'])\n\
          \               or actual_unknown\n               or (bool(todos['unreviewed_view_ids'])\
          \ and not independent_source)\n               or (x.get('pending_action')\
          \ in {'prepare_guide','private_review','actual_review'} and not independent_source))\n\
          \    message=x.get('message', '')\n    if supplier_block:\n        reason\
          \ = '供应商拒绝本次请求' if supplier=='provider_rejected' else '供应商请求结果未知'\n    \
          \    if reason not in message:\n            message += '\\n'+reason+'，请核对原始记录。'\n\
          \    if x.get('blocking_state') == 'local_preflight_rejected' and '未发送图像请求'\
          \ not in message:\n        message += '\\n本地预算前置检查未通过，未发送图像请求。'\n    if\
          \ actual_unknown and not all(value in message for value in unknown):\n \
          \       message += '\\n实际图待确认特征：' + '、'.join(unknown) + '。'\n    if relation_review\
          \ and '专业审阅' not in message:\n        message += '\\n局部连接示意需绑定原交底和本版引导图的专业审阅回执。'\n\
          \    if guide_blocked:\n        names={'pin-hole-fit':'销孔配合','rib-insertion-contact':'入孔肋接触',\n\
          \               'channel-contour':'通道轮廓','channel-partition-solids':'实体分隔壁',\n\
          \               'source-fidelity':'来源形体保真','cable-side-opening':'电缆侧焊接开口'}\n\
          \        detail='、'.join(names.get(f,f)+'（'+f+'）'if f in names else f for\
          \ f in missing)\n        message += '\\n引导待补充，视图 '+str(x.get('blocked_view')or'待定位')+'：'+detail+'。'\n\
          \    output = {'workspace_id': x['workspace_id'], 'route': 'reply' if blocked\
          \ else x.get('route', 'reply'),\n            'done': 'yes' if blocked else\
          \ x.get('done', 'no'), 'message': message,\n            'missing_features':\
          \ missing,\n            **todos,\n            **{k:str(x.get(k) or '') for\
          \ k in ['technical_status','blocking_state','blocked_view','resume_action','deferred_blocking_state','deferred_blocked_view',\n\
          \                                             'expression_mode','supplier_state','semantic_state','pending_action']}}\n\
          \    if supplier_block:\n        output['blocking_state'] = output['blocking_state']\
          \ or supplier\n        output['pending_action'] = output['pending_action']\
          \ or 'inspect_original'\n        output['resume_action'] = output['resume_action']\
          \ or (\n            'qualifying_evidence_and_private_recovery' if supplier=='provider_rejected'\
          \ else 'inspect_original_result')\n    if guide_blocked:\n        output['blocking_state']=output['blocking_state']or'needs_source'\n\
          \        output['pending_action']=output['pending_action']or'prepare_guide'\n\
          \    if relation_review:\n        output['blocking_state'] = output['blocking_state']\
          \ or 'awaiting_guide_review'\n        output['resume_action'] = output['resume_action']\
          \ or 'professional_relation_review'\n    if actual_unknown:\n        output['blocked_view']\
          \ = output['blocked_view'] or unknown[0].split('/')[0]\n        output['blocking_state']\
          \ = output['blocking_state'] or 'awaiting_visual_review'\n        output['pending_action']\
          \ = output['pending_action'] or 'actual_review'\n    return output\n\n\n\
          def loop_outcome(step_done, review_done):\n    return {'done': 'no' if step_done\
          \ == review_done == 'no' else 'yes'}\n\n\ndef inputs(patent_type, technical_type,\
          \ application_stage):\n    patents = {'发明': 'invention', '实用新型': 'utility_model',\
          \ '外观设计': 'design'}\n    technologies = {'自动识别': 'auto', '机械结构': 'mechanical',\
          \ '电气电路': 'electrical',\n        '机电结构': 'mechanical,electrical', '软件/计算机方法':\
          \ 'computer_method', '通信': 'communication', '制造工艺': 'manufacturing_process',\n\
          \        '化学材料': 'chemical_material', '生物医学': 'bio_medical', '半导体': 'semiconductor'}\n\
          \    stages = {'申请前': 'draft', '已申请': 'filed'}\n    if patent_type not in\
          \ patents or technical_type not in technologies or application_stage not\
          \ in stages:\n        raise ValueError('请选择实际申请类型、技术类型和申请阶段')\n    return\
          \ {'patent_type': patents[patent_type], 'technical_type': technologies[technical_type],\
          \ 'application_stage': stages[application_stage]}\n\n\ndef main(patent_type,technical_type,application_stage):\n\
          \ return inputs(patent_type,technical_type,application_stage)\n"
        variables:
        - variable: patent_type
          value_selector:
          - q_start
          - patent_type
        - variable: technical_type
          value_selector:
          - q_start
          - technical_type
        - variable: application_stage
          value_selector:
          - q_start
          - application_stage
        outputs:
          patent_type:
            type: string
            children: null
          technical_type:
            type: string
            children: null
          application_stage:
            type: string
            children: null
